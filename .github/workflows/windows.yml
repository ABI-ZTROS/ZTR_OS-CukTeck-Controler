name: Windows Build
on:
  pull_request:
    paths:
      - 'windows_app/**'
  push:
    branches: [main]
    paths:
      - 'windows_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build NativeAOT self-contained
        working-directory: windows_app/src/CukTechController
        run: |
          dotnet restore
          # Self-contained NativeAOT: single exe, no runtime dependency
          # Includes .NET runtime + AOT-compiled IL
          dotnet publish -c Release -r win-x64 --self-contained true /p:PublishAot=true -o publish
          echo "=== Build output ==="
          ls -la publish/
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-self-contained-aot
          path: windows_app/src/CukTechController/publish/
          retention-days: 30
