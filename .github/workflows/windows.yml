name: Windows Build
on:
  pull_request:
    paths:
      - 'windows_app/**'
  push:
    branches: [main]
    paths:
      - 'windows_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build self-contained
        working-directory: windows_app/src/CukTechController
        run: |
          dotnet restore
          # Self-contained: 包含 .NET 运行时 + WPF，无需用户安装 .NET
          # 注意: WPF 不支持 NativeAOT，使用 JIT 编译的自包含部署
          dotnet publish -c Release -r win-x64 --self-contained true -o publish
          echo "=== Build output ==="
          Get-ChildItem publish/
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-self-contained-aot
          path: windows_app/src/CukTechController/publish/
          retention-days: 30
