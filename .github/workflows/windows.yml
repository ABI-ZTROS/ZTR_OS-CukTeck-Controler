name: Windows Build
on:
  pull_request:
    paths:
      - 'windows_app/**'
  push:
    branches: [main]
    paths:
      - 'windows_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        working-directory: windows_app/src/CukTechController
        run: |
          dotnet restore
          dotnet publish -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows_app/src/CukTechController/publish/
          retention-days: 7
