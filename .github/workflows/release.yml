name: Release
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  ANDROID_ARTIFACT: android-apk
  WINDOWS_ARTIFACT: windows-exe

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Build APK
        working-directory: android_app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANDROID_ARTIFACT }}
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: android_app/build/app/outputs/flutter-apk/app-release.apk

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        working-directory: windows_app/src/CukTechController
        run: |
          dotnet restore
          dotnet publish -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINDOWS_ARTIFACT }}
          path: windows_app/src/CukTechController/publish/
      - uses: softprops/action-gh-release@v2
        with:
          files: windows_app/src/CukTechController/publish/**
