name: Android Build
on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Generate Android scaffolding
        working-directory: android_app
        run: |
          flutter create --platforms=android --project-name=CukTechController .
          # Copy custom Android source files (RootShell, MethodChannel)
          cp -r ../android-app-custom/kotlin/* android/app/src/main/kotlin/
      - name: Add custom Android permissions
        working-directory: android_app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Add custom permissions before <application
          sed -i 's|<application|<!-- Bluetooth permissions -->\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <!-- Location permissions -->\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <!-- Storage permissions -->\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <!-- Root permissions -->\n    <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" />\n    <application|' "$MANIFEST"
          # Add usesCleartextTraffic
          sed -i 's|android:configChanges=|android:usesCleartextTraffic="true"\n            android:configChanges=|' "$MANIFEST"
      - name: Build APK
        working-directory: android_app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
