name: Android Build
on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Generate Android scaffolding
        working-directory: android_app
        run: |
          # 使用 org identifier 生成正确的包名
          flutter create --platforms=android --project-name=cuktech_controller --org com.cuktech .
          
          # 复制自定义 Kotlin 源码（MainActivity, RootShell）
          if [ -d android-app-custom/kotlin ]; then
            mkdir -p android/app/src/main/kotlin/com/cuktech/controller
            cp android-app-custom/kotlin/com/cuktech/controller/*.kt android/app/src/main/kotlin/com/cuktech/controller/
          fi
          
          # 复制自定义 AndroidManifest.xml
          if [ -f android-app-custom/manifest/AndroidManifest.xml ]; then
            cp android-app-custom/manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          
          # 复制自定义资源文件（network_security_config.xml 等）
          if [ -d android-app-custom/manifest/res ]; then
            cp -r android-app-custom/manifest/res/* android/app/src/main/res/
          fi
      - name: Patch compileSdk 34 → 33 (share_plus compatibility)
        working-directory: android_app
        run: |
          # Flutter 3.27+ defaults compileSdk 34, but share_plus 7.2.2 is built for android-33
          # AGP 8's checkReleaseAarMetadata refuses AAR built for older platform
          # Easiest fix: downgrade compileSdk back to 33 in the generated build.gradle.kts
          if grep -q "compileSdk = 34" android/app/build.gradle.kts; then
            sed -i 's/compileSdk = 34/compileSdk = 33/' android/app/build.gradle.kts
            echo "Patched compileSdk 34 → 33"
          elif grep -q "compileSdkVersion 34" android/app/build.gradle; then
            sed -i 's/compileSdkVersion 34/compileSdkVersion 33/' android/app/build.gradle
            echo "Patched compileSdkVersion 34 → 33"
          else
            echo "compileSdk not 34 — current value:"
            grep "compileSdk" android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          fi

      - name: Patch flutter_inappwebview proguard compatibility
        run: |
          # 修复 flutter_inappwebview_android 的 proguard 兼容性问题
          # 新版 Gradle (AGP 8+) 不再支持 getDefaultProguardFile('proguard-android.txt')
          # 需要改为 getDefaultProguardFile('proguard-android-optimize.txt')
          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "PUB_CACHE=$PUB_CACHE"
          find "$PUB_CACHE" -name "build.gradle" -path "*flutter_inappwebview_android*" 2>/dev/null | while read gradle_file; do
            echo "Patching: $gradle_file"
            sed -i "s|getDefaultProguardFile('proguard-android.txt')|getDefaultProguardFile('proguard-android-optimize.txt')|g" "$gradle_file"
          done
      - name: Build APK (all ABIs)
        working-directory: android_app
        run: |
          flutter pub get
          # Split-per-abi: 生成每个架构独立的 APK
          # 支持 armeabi-v7a, arm64-v8a, x86_64
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
          echo "=== Build output ==="
          ls -la build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apks
          path: android_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30