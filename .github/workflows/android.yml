name: Android Build
on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - '.github/workflows/android.yml'
      - '.github/upload-keystore.jks'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Generate Android scaffolding
        working-directory: android_app
        run: |
          flutter create --platforms=android --project-name=cuktech_controller --org com.cuktech .
          if [ -d android-app-custom/kotlin ]; then
            mkdir -p android/app/src/main/kotlin/com/cuktech/controller
            cp android-app-custom/kotlin/com/cuktech/controller/*.kt android/app/src/main/kotlin/com/cuktech/controller/
          fi
          if [ -f android-app-custom/manifest/AndroidManifest.xml ]; then
            cp android-app-custom/manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -d android-app-custom/manifest/res ]; then
            cp -r android-app-custom/manifest/res/* android/app/src/main/res/
          fi

      - name: 🔐 Configure signing — fix keystore copy to android/
        run: |
          echo "=== Copy keystore into project ==="
          cp .github/upload-keystore.jks android_app/android/app/upload-keystore.jks
          echo "keystore copied:" $(ls -la android_app/android/app/upload-keystore.jks)
          echo ""
          echo "=== Write key.properties ==="
          cat > android_app/android/key.properties << 'EOF'
          storePassword=cuktech123
          keyPassword=cuktech123
          keyAlias=dev.cloud.ztr_os
          storeFile=upload-keystore.jks
          EOF
          cat android_app/android/key.properties

      - name: 🔐 Inject signingConfigs into build.gradle.kts
        working-directory: android_app
        run: |
          # Flutter create generates build.gradle.kts. Inject signing after "android {"
          BUILD_FILE="android/app/build.gradle.kts"
          echo "=== Before injection (first 30 lines) ==="
          head -30 "$BUILD_FILE"

          # Find the android { block and insert signingConfigs + buildTypes { release { signingConfig = ... } }
          python3 << 'PYEOF'
          with open("android/app/build.gradle.kts", "r") as f:
              content = f.read()

          # Read key.properties
          props = {}
          with open("android/key.properties", "r") as f:
              for line in f:
                  line = line.strip()
                  if line and not line.startswith("#") and "=" in line:
                      k, v = line.split("=", 1)
                      props[k.strip()] = v.strip()

          # Build signing config block
          signing_block = f"""
          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = java.util.Properties()
          keystoreProperties.load(keystorePropertiesFile.inputStream())

          signingConfigs {{
              create("release") {{
                  keyAlias = "{props.get("keyAlias", "cuktech")}"
                  keyPassword = "{props.get("keyPassword", "cuktech123")}"
                  storeFile = file("${{rootProject.projectDir}}/app/{props.get("storeFile", "upload-keystore.jks")}")
                  storePassword = "{props.get("storePassword", "cuktech123")}"
              }}
          }}
          """.strip()

          # Find android { and inject signingConfigs right after it
          import re
          # Match "android {" possibly with content before next { or } or line
          pattern = r'(android\s*\{)'
          replacement = r'\1\n' + signing_block + '\n\n'

          new_content = re.sub(pattern, replacement, content, count=1)

          # Now add signingConfig to release buildType
          new_content = new_content.replace(
              'buildTypes {\n                release {\n                    isMinifyEnabled = false',
              'buildTypes {\n                release {\n                    signingConfig = signingConfigs.getByName("release")\n                    isMinifyEnabled = false'
          )

          with open("android/app/build.gradle.kts", "w") as f:
              f.write(new_content)

          print("✅ signingConfigs injected")
          PYEOF

          echo ""
          echo "=== After injection (android block area) ==="
          grep -n "signingConfig\|keystore\|keyAlias\|storeFile" android/app/build.gradle.kts

      - name: Build APK (all ABIs) — RELEASE SIGNED
        working-directory: android_app
        run: |
          flutter pub get
          echo "=== Build with signing ==="
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
          echo ""
          echo "=== Build output ==="
          ls -la build/app/outputs/flutter-apk/
          echo ""
          echo "=== Verify signature ==="
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "--- $apk ---"
            $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$apk" 2>&1 | head -5 || echo "apksigner not found, trying jarsigner..."
            jarsigner -verify -verbose -certs "$apk" 2>&1 | grep -E "jar verified|smk|CertPath|CN=" | head -3
          done

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apks-signed
          path: android_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
