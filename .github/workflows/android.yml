name: Android Build
on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Generate Android scaffolding
        working-directory: android_app
        run: |
          flutter create --platforms=android --project-name=cuktech_controller --org com.cuktech .
          if [ -d android-app-custom/kotlin ]; then
            mkdir -p android/app/src/main/kotlin/com/cuktech/controller
            cp android-app-custom/kotlin/com/cuktech/controller/*.kt android/app/src/main/kotlin/com/cuktech/controller/
          fi
          if [ -f android-app-custom/manifest/AndroidManifest.xml ]; then
            cp android-app-custom/manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -d android-app-custom/manifest/res ]; then
            cp -r android-app-custom/manifest/res/* android/app/src/main/res/
          fi
      - name: Disable checkReleaseAarMetadata task (share_plus compat)
        working-directory: android_app
        run: |
          # AGP 8's checkReleaseAarMetadata rejects share_plus built for android-33
          # while flutter_blue_plus requires compileSdk 36. Disable the task by name.
          python3 - << 'PYPATCH'
          import pathlib
          p = pathlib.Path('android/app/build.gradle.kts')
          t = p.read_text()
          inject = """
          // === Patch: disable AGP 8 checkReleaseAarMetadata (share_plus built for android-33) ===
          tasks.matching { it.name.contains("AarMetadata") }.configureEach {
              enabled = false
          }
          """
          if 'AarMetadata' not in t:
              # Insert at end of file (outside android {} block — Gradle tasks are top-level)
              p.write_text(t + inject)
              print('Patched: added tasks.matching disable')
          else:
              print('Already patched')
          print('=== build.gradle.kts tail ===')
          print('\n'.join(p.read_text().splitlines()[-15:]))
          PYPATCH
      - name: Patch flutter_inappwebview proguard
        run: |
          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$PUB_CACHE" -name "build.gradle" -path "*flutter_inappwebview_android*" 2>/dev/null | while read gradle_file; do
            echo "Patching: $gradle_file"
            sed -i "s|getDefaultProguardFile('proguard-android.txt')|getDefaultProguardFile('proguard-android-optimize.txt')|g" "$gradle_file"
          done
      - name: Build APK (all ABIs)
        working-directory: android_app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
          echo "=== Build output ==="
          ls -la build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apks
          path: android_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
