name: Android Build
on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - '.github/workflows/android.yml'
      - '.github/upload-keystore.jks'
      - '.github/signing-injector.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # ------------ 0. 预校验：确保 keystore / python 依赖就绪 + 指纹登记 ------------
      - name: Pre-flight 签名环境自检 + 指纹登记
        id: preflight
        run: |
          set -euo pipefail
          if [ ! -f .github/upload-keystore.jks ]; then
              echo "❌ 缺失 .github/upload-keystore.jks，无法签名。请把 release keystore 按此路径提交（必须是 JKS/PKCS12，alias=dev.cloud.ztr_os）"
              exit 2
          fi
          echo "✅ keystore 大小：$(ls -l .github/upload-keystore.jks | awk '{print $5}') bytes"
          echo "✅ python3：$(python3 --version)"
          keytool -list -keystore .github/upload-keystore.jks \
                  -storepass cuktech123 \
                  -alias dev.cloud.ztr_os >/dev/null 2>/tmp/kt_err \
            || {
                echo "❌ keytool 预校验失败"
                echo "-------- STDERR --------"
                cat /tmp/kt_err
                echo
                echo "→ 常见原因：storePassword 不是 cuktech123、alias 不是 dev.cloud.ztr_os、.jks 已损坏/非 JKS 格式"
                exit 3
              }
          echo "✅ keytool 预校验通过：alias 'dev.cloud.ztr_os' 存在于 keystore"

          # 登记期望的 release SHA-256 指纹，后续 APK 校验必须严格一致
          # 注意：Oracle keytool 输出「SHA256:」，OpenJDK keytool 有时输出「SHA-256:」，必须两种都兼容。
          EXPECTED_SHA256="$(keytool -list -keystore .github/upload-keystore.jks \
                                     -storepass cuktech123 \
                                     -alias dev.cloud.ztr_os -v 2>/dev/null \
                        | grep -E "Certificate fingerprints|SHA-?256" \
                        | grep -oE "SHA-?256:[[:space:]]*[0-9A-Fa-f:]{95,}" \
                        | head -1 \
                        | sed -E 's/^SHA-?256:[[:space:]]*//')"
          if [ -z "$EXPECTED_SHA256" ]; then
              echo "❌ 无法提取 SHA-256 指纹，后续 APK 校验无法继续"
              echo "   debug 输出 keytool -v："
              keytool -list -keystore .github/upload-keystore.jks -storepass cuktech123 -alias dev.cloud.ztr_os -v 2>&1 | head -40
              exit 5
          fi
          echo "EXPECTED_SHA256=$EXPECTED_SHA256" | tee -a "$GITHUB_OUTPUT"
          echo "✅ 登记 release 证书指纹 SHA-256 = $EXPECTED_SHA256"

      # ------------ 1. Flutter 创建 android/ 脚手架 + 复制自定义源码 ------------
      - name: Generate Android scaffolding
        working-directory: android_app
        run: |
          set -euo pipefail
          flutter create --platforms=android \
                         --project-name=cuktech_controller \
                         --org com.cuktech .

          if [ -d android-app-custom/kotlin ]; then
              mkdir -p android/app/src/main/kotlin/com/cuktech/controller
              cp -v android-app-custom/kotlin/com/cuktech/controller/*.kt \
                    android/app/src/main/kotlin/com/cuktech/controller/
          fi

          if [ -f android-app-custom/manifest/AndroidManifest.xml ]; then
              cp -v android-app-custom/manifest/AndroidManifest.xml \
                    android/app/src/main/AndroidManifest.xml
          fi

          if [ -d android-app-custom/manifest/res ]; then
              mkdir -p android/app/src/main/res
              cp -vr android-app-custom/manifest/res/* android/app/src/main/res/
          fi

          # 诊断：flutter create 最终写的 build.gradle 到底是 Groovy 还是 KTS
          echo
          echo "=== Flutter create 生成的 app/build.gradle* ==="
          ls -la android/app/build.gradle* 2>&1 || echo "(没有任何 build.gradle → flutter create 可能失败)"
          echo

      # ------------ 2. 拷贝 keystore + 用 python injector 双格式注入 ------------
      - name: 🔐 注入 release 签名 (python injector，Groovy/KTS 双格式)
        run: |
          set -euo pipefail

          # 2a) keystore → android/app/upload-keystore.jks
          cp -v .github/upload-keystore.jks android_app/android/app/upload-keystore.jks

          # 2b) 自动判断 Groovy 还是 KTS；找实际存在的文件
          GRADLE=""
          if   [ -f android_app/android/app/build.gradle.kts ]; then
              GRADLE=android_app/android/app/build.gradle.kts
          elif [ -f android_app/android/app/build.gradle ]; then
              GRADLE=android_app/android/app/build.gradle
          else
              echo "❌ 找不到 android_app/android/app/build.gradle 或 .gradle.kts"
              echo "   android_app/android/app/ 目录："
              ls -la android_app/android/app/ 2>&1 || true
              exit 4
          fi
          echo "✅ 选中文件：$GRADLE"

          # 2c) Python 注入（带别名存在性校验，不通过立即打印中文说明退出）
          python3 .github/signing-injector.py \
              --gradle         "$GRADLE"                           \
              --keystore       android_app/android/app/upload-keystore.jks \
              --properties-out android_app/android/key.properties  \
              --storePass      cuktech123                           \
              --keyPass        cuktech123                           \
              --alias          dev.cloud.ztr_os                     \
              --alias-must-exist

          echo
          echo "=== 最终 build.gradle 头 50 行 ==="
          head -50 "$GRADLE"
          echo
          echo "=== 最终 release buildType 段 ==="
          awk '
            /buildTypes[[:space:]]*\{/ { in_bt=1 }
            in_bt { print NR": "$0 }
            /release[[:space:]]*\{|getByName\(\"release\"\)\{/ { in_r=1 }
            in_r { print NR": RELEASE >> "$0 }
            # 括号平衡简单计数：遇到 { +1，遇到 } -1
            in_r && /\{/ { bc++; next }
            in_r && /\}/ { bc--; if (bc==0) { in_r=0; in_bt=0 } }
          ' "$GRADLE"

      # ------------ 3. Flutter 构建（release + split-per-abi） ------------
      - name: Build APK — release 签名
        working-directory: android_app
        run: |
          set -euo pipefail
          flutter pub get

          flutter build apk --release \
                            --split-per-abi \
                            --target-platform android-arm,android-arm64,android-x64

          echo "=== Signed APKs ==="
          ls -la build/app/outputs/flutter-apk/

      # ------------ 4. 签名证书验证（SHA-256 指纹必须等于 keystore 的，防 debug key 冒充 release） ------------
      - name: ✅ 最终 APK 签名指纹硬校验 (SHA-256)
        env:
          EXPECTED_SHA256: ${{ steps.preflight.outputs.EXPECTED_SHA256 }}
        run: |
          set -euo pipefail
          : "${EXPECTED_SHA256:?缺少 EXPECTED_SHA256（preflight 没跑成功？）}"

          NORMALIZE_FP() {
              # 转大写，去空格
              echo "$1" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]'
          }
          EXP="$(NORMALIZE_FP "$EXPECTED_SHA256")"
          echo "🔍 期望 SHA-256：$EXP"

          APK_COUNT=0
          for apk in android_app/build/app/outputs/flutter-apk/*.apk; do
            [ -f "$apk" ] || continue
            APK_COUNT=$((APK_COUNT+1))
            echo
            echo "=== 校验 APK：$apk ==="
            APK_SHA=""

            # 方法 A：优先用 apksigner（需要 Android SDK build-tools），对 v2/v3 scheme 最准
            if command -v apksigner >/dev/null 2>&1; then
              set +e
              CERT_DER="$(mktemp -u).rsa.pkcs8.der"
              apksigner verify --print-certs --verbose "$apk" > /tmp/apksig_$$.txt 2>&1
              RC=$?
              set -e
              if [ $RC -eq 0 ]; then
                  APK_SHA="$(grep -oE "SHA-256[[:space:]]*digest:[[:space:]]*[0-9a-fA-F:]{95,}" /tmp/apksig_$$.txt \
                            | head -1 | sed -E 's/SHA-256[[:space:]]+digest:[[:space:]]*//')"
                  echo "   apksigner SHA-256：$APK_SHA"
              else
                  echo "   ⚠️  apksigner 返回非 0，改用 keytool -printcert 兜底（见下）"
                  cat /tmp/apksig_$$.txt | head -20 || true
              fi
              rm -f /tmp/apksig_$$.txt
            fi

            # 方法 B：从 META-INF/*.RSA (v1 scheme / jar signing) 兜底提取 Owner+SHA-256
            if [ -z "$APK_SHA" ]; then
              CERT_DER="$(mktemp).RSA"
              set +e
              unzip -p "$apk" META-INF/*.RSA > "$CERT_DER" 2>/dev/null
              RC=$?
              set -e
              if [ $RC -eq 0 ] && [ -s "$CERT_DER" ]; then
                OUT="$(keytool -printcert -file "$CERT_DER" 2>/dev/null)"
                SUBJECT="$(echo "$OUT" | grep -E "^Owner:" | head -1)"
                echo "   APK 内 META-INF/*.RSA → $SUBJECT"
                APK_SHA="$(echo "$OUT" \
                          | grep -oE "SHA-?256:[[:space:]]*[0-9A-Fa-f:]{95,}" \
                          | head -1 | sed -E 's/^SHA-?256:[[:space:]]*//')"
                echo "   keytool SHA-256：$APK_SHA"
                rm -f "$CERT_DER"
              fi
            fi

            if [ -z "$APK_SHA" ]; then
              echo "   ❌ 两种方式都没能提取到证书 SHA-256 → 这 APK 极可能未签名"
              exit 10
            fi

            GOT="$(NORMALIZE_FP "$APK_SHA")"
            if [ "$GOT" = "$EXP" ]; then
              echo "   ✅ 指纹严格匹配：确认使用自定义 release 签名 (CN=Dev.Cloud.ZTR_OS)"
            else
              echo "   ❌ 指纹不匹配！"
              echo "      期望：$EXP"
              echo "      实际：$GOT"
              echo "      → 常见原因：signingConfigs.release 没有被写入 buildTypes.release、"
              echo "         release 块仍在复用 signingConfigs.debug、或 keystore 本身被替换。"
              # 附加诊断：如果是 debug key 会命中下面的特征
              case "$GOT" in
                *"12:E4:70:5B:4C:F9:90:B2:80:55:80:7F:31:0E:0B:41:A3:89:73:64:D0:91:7A:3F:01:82:9F:2C:5E:80:4A:FB"*)
                  echo "      → 特征命中：此为 Android 默认 debug.keystore（CN=Android Debug），签名注入 100% 失败！" ;;
              esac
              exit 11
            fi
          done

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ 没发现任何 APK → flutter build apk 可能没产出或路径变化"
            ls -la android_app/build/app/outputs/flutter-apk/ 2>&1 || true
            exit 12
          fi
          echo
          echo "🎉 全部 $APK_COUNT 个 APK 通过签名指纹硬校验 ✅"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apks-signed
          path: android_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
