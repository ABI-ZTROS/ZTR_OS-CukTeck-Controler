name: Android Build
on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - '.github/workflows/android.yml'
      - '.github/upload-keystore.jks'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Generate Android scaffolding
        working-directory: android_app
        run: |
          flutter create --platforms=android --project-name=cuktech_controller --org com.cuktech .
          if [ -d android-app-custom/kotlin ]; then
            mkdir -p android/app/src/main/kotlin/com/cuktech/controller
            cp android-app-custom/kotlin/com/cuktech/controller/*.kt android/app/src/main/kotlin/com/cuktech/controller/
          fi
          if [ -f android-app-custom/manifest/AndroidManifest.xml ]; then
            cp android-app-custom/manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -d android-app-custom/manifest/res ]; then
            cp -r android-app-custom/manifest/res/* android/app/src/main/res/
          fi

      - name: 🔐 Setup signing — keystore + key.properties + sed inject
        run: |
          cp .github/upload-keystore.jks android_app/android/app/upload-keystore.jks
          cat > android_app/android/key.properties << 'PROPS'
          storePassword=cuktech123
          keyPassword=cuktech123
          keyAlias=dev.cloud.ztr_os
          storeFile=upload-keystore.jks
          PROPS

          # ---- Inject import java.util.Properties at FILE TOP ----
          sed -i '1i import java.util.Properties' android_app/android/app/build.gradle.kts

          # ---- Write signing block to temp file (HEREDOC with literal ${} — CRITICAL!) ----
          cat > /tmp/signing_block.txt << 'KOTLIN_BLOCK'
          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()
          keystoreProperties.load(keystorePropertiesFile.inputStream())

          signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties.getProperty("keyAlias")
                  keyPassword = keystoreProperties.getProperty("keyPassword")
                  storeFile = file("${rootProject.projectDir}/app/${keystoreProperties.getProperty("storeFile")}")
                  storePassword = keystoreProperties.getProperty("storePassword")
              }
          }

          KOTLIN_BLOCK

          # ---- awk: insert block after "android {" ----
          awk '
            NR==FNR && /^$/ && !blank_seen { blank_seen=1; next }   # skip trailing blank
            NR==FNR { block[++n]=$0; next }
            /android[[:space:]]*\{/ {
              print
              for (i=1;i<=n;i++) print block[i]
              print ""
              next
            }
            { print }
          ' /tmp/signing_block.txt android_app/android/app/build.gradle.kts > /tmp/build_new.kts
          mv /tmp/build_new.kts android_app/android/app/build.gradle.kts

          # ---- Add signingConfig to release buildType ----
          sed -i 's/isMinifyEnabled = false/signingConfig = signingConfigs.getByName("release")\n                    isMinifyEnabled = false/' android_app/android/app/build.gradle.kts

          echo "=== Verify injected file (top 40 lines) ==="
          head -40 android_app/android/app/build.gradle.kts

      - name: Build APK — Dev.Cloud.ZTR_OS signed
        working-directory: android_app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
          echo "=== Signed APKs ==="
          ls -la build/app/outputs/flutter-apk/
          echo "=== Certificate verify ==="
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "--- $apk ---"
            jarsigner -verify -certs "$apk" 2>&1 | grep -E "jar verified|CN=" | head -3
          done

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apks-signed
          path: android_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
