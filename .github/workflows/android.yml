name: Android Build
on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - '.github/workflows/android.yml'
      - '.github/upload-keystore.jks'
      - '.github/signing-injector.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # ------------ 0. 预校验：确保 keystore / python 依赖就绪 + 指纹登记 ------------
      - name: Pre-flight 签名环境自检 + 指纹登记
        id: preflight
        run: |
          set -euo pipefail
          if [ ! -f .github/upload-keystore.jks ]; then
              echo "❌ 缺失 .github/upload-keystore.jks，无法签名。请把 release keystore 按此路径提交（必须是 JKS/PKCS12，alias=dev.cloud.ztr_os）"
              exit 2
          fi
          echo "✅ keystore 大小：$(ls -l .github/upload-keystore.jks | awk '{print $5}') bytes"
          echo "✅ python3：$(python3 --version)"
          keytool -list -keystore .github/upload-keystore.jks \
                  -storepass cuktech123 \
                  -alias dev.cloud.ztr_os >/dev/null 2>/tmp/kt_err \
            || {
                echo "❌ keytool 预校验失败"
                echo "-------- STDERR --------"
                cat /tmp/kt_err
                echo
                echo "→ 常见原因：storePassword 不是 cuktech123、alias 不是 dev.cloud.ztr_os、.jks 已损坏/非 JKS 格式"
                exit 3
              }
          echo "✅ keytool 预校验通过：alias 'dev.cloud.ztr_os' 存在于 keystore"

          # 登记期望的 release SHA-256 指纹，后续 APK 校验必须严格一致
          # 注意：Oracle keytool 输出「SHA256:」，OpenJDK keytool 有时输出「SHA-256:」，必须两种都兼容。
          # grep -m1 代替 grep | head -1：在 set -euo pipefail 下避免 SIGPIPE 退出码 141 触发炸机
          EXPECTED_SHA256="$(keytool -list -keystore .github/upload-keystore.jks \
                                     -storepass cuktech123 \
                                     -alias dev.cloud.ztr_os -v 2>/dev/null \
                        | grep -E "Certificate fingerprints|SHA-?256" \
                        | grep -m1 -oE "SHA-?256:[[:space:]]*[0-9A-Fa-f:]{95,}" \
                        | sed -E 's/^SHA-?256:[[:space:]]*//' || true)"
          if [ -z "$EXPECTED_SHA256" ]; then
              echo "❌ 无法提取 SHA-256 指纹，后续 APK 校验无法继续"
              echo "   debug 输出 keytool -v："
              keytool -list -keystore .github/upload-keystore.jks -storepass cuktech123 -alias dev.cloud.ztr_os -v 2>&1 | head -40
              exit 5
          fi
          echo "EXPECTED_SHA256=$EXPECTED_SHA256" | tee -a "$GITHUB_OUTPUT"
          echo "✅ 登记 release 证书指纹 SHA-256 = $EXPECTED_SHA256"

      # ------------ 1. Flutter 创建 android/ 脚手架 + 复制自定义源码 ------------
      - name: Generate Android scaffolding
        working-directory: android_app
        run: |
          set -euo pipefail
          flutter create --platforms=android \
                         --project-name=cuktech_controller \
                         --org com.cuktech .

          if [ -d android-app-custom/kotlin ]; then
              mkdir -p android/app/src/main/kotlin/com/cuktech/controller
              cp -v android-app-custom/kotlin/com/cuktech/controller/*.kt \
                    android/app/src/main/kotlin/com/cuktech/controller/
          fi

          if [ -f android-app-custom/manifest/AndroidManifest.xml ]; then
              cp -v android-app-custom/manifest/AndroidManifest.xml \
                    android/app/src/main/AndroidManifest.xml
          fi

          if [ -d android-app-custom/manifest/res ]; then
              mkdir -p android/app/src/main/res
              cp -vr android-app-custom/manifest/res/* android/app/src/main/res/
          fi

          # 诊断：flutter create 最终写的 build.gradle 到底是 Groovy 还是 KTS
          echo
          echo "=== Flutter create 生成的 app/build.gradle* ==="
          ls -la android/app/build.gradle* 2>&1 || echo "(没有任何 build.gradle → flutter create 可能失败)"
          echo

      # ------------ 2. 拷贝 keystore + 用 python injector 双格式注入 ------------
      - name: 🔐 注入 release 签名 (python injector，Groovy/KTS 双格式)
        run: |
          set -euo pipefail

          # 2a) keystore → android/app/upload-keystore.jks
          cp -v .github/upload-keystore.jks android_app/android/app/upload-keystore.jks

          # 2b) 自动判断 Groovy 还是 KTS；找实际存在的文件
          GRADLE=""
          if   [ -f android_app/android/app/build.gradle.kts ]; then
              GRADLE=android_app/android/app/build.gradle.kts
          elif [ -f android_app/android/app/build.gradle ]; then
              GRADLE=android_app/android/app/build.gradle
          else
              echo "❌ 找不到 android_app/android/app/build.gradle 或 .gradle.kts"
              echo "   android_app/android/app/ 目录："
              ls -la android_app/android/app/ 2>&1 || true
              exit 4
          fi
          echo "✅ 选中文件：$GRADLE"

          # 2c) Python 注入（带别名存在性校验，不通过立即打印中文说明退出）
          python3 .github/signing-injector.py \
              --gradle         "$GRADLE"                           \
              --keystore       android_app/android/app/upload-keystore.jks \
              --properties-out android_app/android/key.properties  \
              --storePass      cuktech123                           \
              --keyPass        cuktech123                           \
              --alias          dev.cloud.ztr_os                     \
              --alias-must-exist

          echo
          echo "=== 最终 build.gradle 头 50 行 ==="
          head -50 "$GRADLE"
          echo
          echo "=== 最终 release buildType 段（Python 解析，括号平衡准确，无 awk 转义 warning） ==="
          python3 .github/inspect-gradle-buildtypes.py "$GRADLE"

      # ------------ 3. Flutter 构建（release + split-per-abi） ------------
      - name: Build APK — release 签名
        working-directory: android_app
        run: |
          set -euo pipefail
          flutter pub get

          flutter build apk --release \
                            --split-per-abi \
                            --target-platform android-arm,android-arm64,android-x64

          echo "=== Signed APKs ==="
          ls -la build/app/outputs/flutter-apk/

      # ------------ 4. 签名证书验证（SHA-256 指纹必须等于 keystore 的，防 debug key 冒充 release） ------------
      - name: ✅ 最终 APK 签名指纹硬校验 (SHA-256)
        env:
          EXPECTED_SHA256: ${{ steps.preflight.outputs.EXPECTED_SHA256 }}
        run: |
          set -euo pipefail
          : "${EXPECTED_SHA256:?缺少 EXPECTED_SHA256（preflight 没跑成功？）}"

          NORMALIZE_FP() {
              # 转大写，去空格
              echo "$1" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]'
          }
          EXP="$(NORMALIZE_FP "$EXPECTED_SHA256")"
          echo "🔍 期望 SHA-256：$EXP"

          APK_COUNT=0
          for apk in android_app/build/app/outputs/flutter-apk/*.apk; do
            [ -f "$apk" ] || continue
            APK_COUNT=$((APK_COUNT+1))
            echo
            echo "=== 校验 APK：$apk ==="
            ls -la "$apk"
            echo "   META-INF 清单（判断是否有 v1 jar 签名）:"
            set +e
            unzip -l "$apk" | grep -E "META-INF/.*\.(RSA|EC|DSA|SF)" | head -20
            set -e
            APK_SHA=""
            APK_SIGNER_INFO=""

            # 方法 1：apksigner verify —— 最权威，覆盖 v1/v2/v3/v4 签名方案
            if [ -z "$APK_SHA" ]; then
              APKSIGNER_BIN=""
              if command -v apksigner >/dev/null 2>&1; then
                APKSIGNER_BIN=apksigner
              elif [ -n "${ANDROID_SDK_ROOT:-}" ] || [ -n "${ANDROID_HOME:-}" ]; then
                SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
                # build-tools 里通常都有 apksigner
                CANDIDATE="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
                if [ -n "$CANDIDATE" ]; then APKSIGNER_BIN="$CANDIDATE"; fi
              fi
              echo "   [method 1] apksigner binary: ${APKSIGNER_BIN:-<not found>}"
              if [ -n "$APKSIGNER_BIN" ]; then
                SIG_OUT="/tmp/apksig_$$.txt"
                set +e
                "$APKSIGNER_BIN" verify --print-certs --verbose "$apk" > "$SIG_OUT" 2>&1
                RC=$?
                set -e
                echo "   [method 1] apksigner verify rc=$RC"
                echo "   [method 1] apksigner 完整输出（逐行，便于修正则）："
                cat -n "$SIG_OUT" 2>/dev/null || true
                # 先以宽松格式从输出取 SHA-256。
                #   Android build-tools 37 / 34 常见格式：
                #     Signer #1 certificate SHA-256 digest: AA:BB:CC:...
                #     Signer #1 certificate SHA256 digest: AA:BB:CC:...
                #     Signer #1 Cert SHA-256: AA:BB:CC:...
                # 注意：外面是 set -euo pipefail，绝对不能出现「producer | head -1」
                # 否则 head 读完就关读端，producer 被 SIGPIPE 杀掉，退出码 141 触发 pipefail→errexit。
                # awk 内部已自带「找到即 print + exit」，最多输出一行，不允许再管道接 head。
                APK_SHA="$(
                  awk '{
                    line=tolower($0)
                    idx=index(line, "sha-256"); if (idx==0) idx=index(line, "sha256")
                    if (idx==0) next
                    rest=substr(line, idx)
                    n=split(rest, arr, /[:[:space:]]+/)
                    for (s=1;s<=n;s++) {
                      cand=""
                      for (e=s;e<=s+31 && e<=n;e++) {
                        v=arr[e]
                        if (v !~ /^[0-9a-f][0-9a-f]$/) break
                        cand = cand (cand=="" ? "" : ":") v
                      }
                      if (e-s==32) { print cand; exit }
                    }
                  }' "$SIG_OUT"
                )"
                if [ -z "$APK_SHA" ]; then
                  # grep -m1：匹配到 1 行就停止，等价于 grep | head -1 但无管道无 SIGPIPE 风险
                  APK_SHA="$(grep -m1 -oE "[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){30,}" "$SIG_OUT" || true)"
                fi
                SIGNER_NAME="$(grep -Ei "Signer #[0-9]+|certificate|subject|Owner|Issuer|DN:" "$SIG_OUT" | head -8 || true)"
                APK_SIGNER_INFO="${SIGNER_NAME}"
                echo "   [method 1] APK_SHA extracted='${APK_SHA:-<empty>}'"
              fi
            fi

            # 方法 2：unzip 解 APK 的 META-INF/*.RSA / .EC / .DSA，再用 3 种子工具提取
            if [ -z "$APK_SHA" ]; then
              echo "   [method 2] 尝试从 META-INF 解出签名块 (v1 jar scheme)"
              RSA_OUT="/tmp/apk_cert_$$.out"
              rm -f "$RSA_OUT"
              # 取 APK 中第一个非 SF 的签名文件（.RSA / .EC / .DSA）
              CANDIDATE_NAME="$(unzip -l "$apk" 2>/dev/null \
                | grep -oE "META-INF/[^ ]*\.(RSA|EC|DSA)" \
                | head -1 || true)"
              echo "   [method 2] candidate=$CANDIDATE_NAME"
              if [ -n "$CANDIDATE_NAME" ]; then
                SIGFILE="/tmp/apk_sig_$$.sig"
                rm -f "$SIGFILE"
                unzip -p "$apk" "$CANDIDATE_NAME" > "$SIGFILE" 2>/dev/null || true
                if [ -s "$SIGFILE" ]; then
                  echo "   [method 2] ${CANDIDATE_NAME} 提取成功, size=$(wc -c < "$SIGFILE") bytes"
                  # 2a) keytool -printcert -file (最稳，覆盖 PKCS7 包裹的证书)
                  set +e
                  KT_OUT="$(keytool -printcert -file "$SIGFILE" 2>/dev/null)"
                  RC=$?
                  set -e
                  if [ "$RC" -eq 0 ] && [ -n "$KT_OUT" ]; then
                    echo "   [method 2a] keytool -printcert Subject line:"
                    echo "$KT_OUT" | grep -E "^(Owner|Issuer|SHA-?256):" | head -5 || true
                    # grep -m1：内置「第一匹配即停」，避免 grep | head 管道 SIGPIPE 在 pipefail 下炸
                    APK_SHA="$(echo "$KT_OUT" \
                              | grep -m1 -oEi "SHA-?256:[[:space:]]*[0-9A-Fa-f:]{95,}" \
                              | sed -E 's/^SHA-?256:[[:space:]]*//I' || true)"
                    APK_SIGNER_INFO="$(echo "$KT_OUT" | grep -E "^(Owner|Issuer):" | head -2 || true)"
                  fi

                  # 2b) openssl pkcs7 -inform DER -print_certs → openssl x509 -fingerprint -sha256
                  if [ -z "$APK_SHA" ] && command -v openssl >/dev/null 2>&1; then
                    CERTS_PEM="/tmp/apk_certs_$$.pem"
                    openssl pkcs7 -inform DER -in "$SIGFILE" -print_certs -out "$CERTS_PEM" 2>/dev/null || true
                    if [ -s "$CERTS_PEM" ]; then
                      FIRST_PEM="/tmp/apk_first_$$.pem"
                      awk 'BEGIN{c=0} /-----BEGIN CERTIFICATE-----/{c++} c==1{print} c>=1 && /-----END CERTIFICATE-----/{exit}' "$CERTS_PEM" > "$FIRST_PEM"
                      if [ -s "$FIRST_PEM" ]; then
                        SUBJ="$(openssl x509 -in "$FIRST_PEM" -noout -subject 2>/dev/null || true)"
                        FP="$(openssl x509 -in "$FIRST_PEM" -noout -fingerprint -sha256 2>/dev/null || true)"
                        APK_SHA="$(echo "$FP" | sed -E 's/^SHA256=//' | tr -d '\r')"
                        APK_SIGNER_INFO="openssl subject=$SUBJ"
                        rm -f "$CERTS_PEM" "$FIRST_PEM"
                      fi
                    fi
                  fi

                  # 2c) keytool -printcert -jarfile (JDK 老路径)
                  if [ -z "$APK_SHA" ]; then
                    set +e
                    KT2_OUT="$(keytool -printcert -jarfile "$apk" 2>&1)"
                    RC=$?
                    set -e
                    if [ "$RC" -eq 0 ] && [ -n "$KT2_OUT" ]; then
                      APK_SHA="$(echo "$KT2_OUT" \
                                | grep -m1 -oEi "SHA-?256:[[:space:]]*[0-9A-Fa-f:]{95,}" \
                                | sed -E 's/^SHA-?256:[[:space:]]*//I' || true)"
                      APK_SIGNER_INFO="$(echo "$KT2_OUT" | grep -E "^(Owner|Issuer):" | head -2 || true)"
                    fi
                  fi
                fi
                rm -f "$SIGFILE"
              fi
            fi

            # 方法 3：jarsigner -verify -verbose -certs（JDK 自带，最老版本也能跑）
            if [ -z "$APK_SHA" ]; then
              echo "   [method 3] jarsigner 兜底"
              set +e
              JS_OUT="$(jarsigner -verify -verbose -certs "$apk" 2>&1)"
              RC=$?
              set -e
              if [ "$RC" -eq 0 ] || [ -n "$JS_OUT" ]; then
                APK_SHA="$(echo "$JS_OUT" \
                          | grep -m1 -oEi "SHA-?256:[[:space:]]*[0-9A-Fa-f:]{95,}" \
                          | sed -E 's/^SHA-?256:[[:space:]]*//I' || true)"
                APK_SIGNER_INFO="jarsigner signer=$(echo "$JS_OUT" | grep -m1 -oE "CN=[^,]+" || true)"
              fi
            fi

            if [ -n "$APK_SIGNER_INFO" ]; then
              echo "   🔏 Signer 信息:"
              echo "$APK_SIGNER_INFO" | sed 's/^/        /'
            fi

            if [ -z "$APK_SHA" ]; then
              echo "   ❌ 以上 3 类方法都没能提取到证书 SHA-256"
              echo "      → 常见原因：(a) APK 确实没被签；(b) flutter 用 Android Gradle Plugin 新版本默认"
              echo "         v2/v3-only scheme，导致 META-INF/*.RSA 为空，但 apksigner 也拿不到，说明"
              echo "         signingConfig=release 根本没生效；(c) Android SDK build-tools 中 apksigner"
              echo "         不在 PATH 中，且 JDK 的 jarsigner/keytool 都读不到 v2-only scheme 的证书。"
              echo "      → 下一步诊断：直接在 Build APK 段末尾用 ./gradlew signingReport 看 release signingConfig 到底是谁"
              exit 10
            fi
            echo "   🔑 APK 证书 SHA-256 提取成功：$APK_SHA"

            GOT="$(NORMALIZE_FP "$APK_SHA")"
            if [ "$GOT" = "$EXP" ]; then
              echo "   ✅ 指纹严格匹配：确认使用自定义 release 签名 (CN=Dev.Cloud.ZTR_OS)"
            else
              echo "   ❌ 指纹不匹配！"
              echo "      期望：$EXP"
              echo "      实际：$GOT"
              echo "      → 常见原因：signingConfigs.release 没有被写入 buildTypes.release、"
              echo "         release 块仍在复用 signingConfigs.debug、或 keystore 本身被替换。"
              # 附加诊断：如果是 debug key 会命中下面的特征
              case "$GOT" in
                *"12:E4:70:5B:4C:F9:90:B2:80:55:80:7F:31:0E:0B:41:A3:89:73:64:D0:91:7A:3F:01:82:9F:2C:5E:80:4A:FB"*)
                  echo "      → 特征命中：此为 Android 默认 debug.keystore（CN=Android Debug），签名注入 100% 失败！" ;;
              esac
              exit 11
            fi
          done

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ 没发现任何 APK → flutter build apk 可能没产出或路径变化"
            ls -la android_app/build/app/outputs/flutter-apk/ 2>&1 || true
            exit 12
          fi
          echo
          echo "🎉 全部 $APK_COUNT 个 APK 通过签名指纹硬校验 ✅"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apks-signed
          path: android_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
