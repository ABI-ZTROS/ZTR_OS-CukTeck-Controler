name: Android Build
on:
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Generate Android scaffolding
        working-directory: android_app
        run: |
          # 使用 org identifier 生成正确的包名
          flutter create --platforms=android --project-name=cuktech_controller --org com.cuktech .
          
          # 复制自定义 Kotlin 源码（MainActivity, RootShell）
          if [ -d android-app-custom/kotlin ]; then
            mkdir -p android/app/src/main/kotlin/com/cuktech/controller
            cp android-app-custom/kotlin/com/cuktech/controller/*.kt android/app/src/main/kotlin/com/cuktech/controller/
          fi
          
          # 复制自定义 AndroidManifest.xml
          if [ -f android-app-custom/manifest/AndroidManifest.xml ]; then
            cp android-app-custom/manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          
          # 复制自定义资源文件（network_security_config.xml 等）
          if [ -d android-app-custom/manifest/res ]; then
            cp -r android-app-custom/manifest/res/* android/app/src/main/res/
          fi
      - name: Build APK (all ABIs)
        working-directory: android_app
        run: |
          flutter pub get
          # Split-per-abi: 生成每个架构独立的 APK
          # 支持 armeabi-v7a, arm64-v8a, x86_64
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
          echo "=== Build output ==="
          ls -la build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apks
          path: android_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30